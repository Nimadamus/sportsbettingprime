name: Daily Sharp Consensus Update

on:
  # Resumed 2026-09-29. The paused-in-July defect is fixed: the badge counts only
  # contest leaders' picks, and the Covers public split is kept in public_sides and
  # printed beside it, never summed into the count.
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: consensus-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-consensus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Sharp Consensus Update
        run: |
          python scripts/github_consensus_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Sharp Consensus update - $(date +'%A, %B %d, %Y')

          🤖 Auto-generated by GitHub Actions"
          # Pull with rebase - ABORT on conflict instead of pushing broken files
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push && break
            else
              echo "Rebase conflict on attempt $attempt - aborting rebase and retrying"
              git rebase --abort
              sleep 10
            fi
          done
