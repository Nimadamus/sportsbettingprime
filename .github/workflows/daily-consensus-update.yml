name: Daily Sharp Consensus Update

on:
  # SCHEDULE REMOVED 2026-07-21, pending a decision on whether consensus returns.
  #
  # The scraper itself (scripts/github_consensus_update.py) is sound - it queries
  # Covers.com for real picks, contains no random number generation, and fails
  # loudly rather than inventing data when a feed is unreachable. It is kept.
  #
  # What is not sound is how the result was presented. _consensus_weight() at
  # line 407 buckets a scraped PUBLIC-MONEY PERCENTAGE into an integer and then
  # sums it into the same counter as real handicapper picks, so a card reading
  # "8x" could mean "public money was over 75%" rather than "8 handicappers
  # picked this". That is a fake consensus count and it must be fixed before
  # anything under this heading is published again.
  #
  # Existing covers-consensus-*.html URLs remain live and are not being deleted.
  #   - cron: '0 15 * * *'
  #   - cron: '0 21 * * *'
  workflow_dispatch:  # Manual only

concurrency:
  group: consensus-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-consensus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Sharp Consensus Update
        run: |
          python scripts/github_consensus_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Sharp Consensus update - $(date +'%A, %B %d, %Y')

          🤖 Auto-generated by GitHub Actions"
          # Pull with rebase - ABORT on conflict instead of pushing broken files
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push && break
            else
              echo "Rebase conflict on attempt $attempt - aborting rebase and retrying"
              git rebase --abort
              sleep 10
            fi
          done
