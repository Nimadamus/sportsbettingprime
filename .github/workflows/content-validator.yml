name: Content Validator

# Replaces the previous validator, which scanned for "coming soon"/"TBD" and a
# hardcoded list of NBA player-team pairs. It passed every single build in which
# this site published statistics generated by random.uniform(), which is the only
# failure that has ever actually happened here.
#
# scripts/validate_site.py checks the things that went wrong:
#   fabricated-stat fingerprints, randomness in content generators,
#   guaranteed-win language, misuse of "verified", noindex directives,
#   broken internal links, fact-manifest integrity, and capability overclaims
#   (live odds, real-time data, "updated multiple times daily").

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.py'
      - 'facts/**'
      - 'robots.txt'
      - '.github/workflows/content-validator.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate site content
        run: python scripts/validate_site.py

      - name: Check sitemap is not uniformly stamped
        run: |
          python - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path('sitemap.xml')
          if not p.exists():
              print('sitemap.xml missing'); sys.exit(1)
          xml = p.read_text(encoding='utf-8')
          urls = xml.count('<url>')
          dates = set(re.findall(r'<lastmod>([^<]+)</lastmod>', xml))
          print(f'{urls} URLs, {len(dates)} distinct lastmod dates')
          if urls > 5 and len(dates) <= 1:
              print('FAIL: every URL shares one lastmod date')
              sys.exit(1)
          PY

      - name: Summary
        if: always()
        run: |
          echo "### Content validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rules enforced: no fabricated statistics, no randomness in generators," >> $GITHUB_STEP_SUMMARY
          echo "no guaranteed-win language, no unsupported use of 'verified', no noindex," >> $GITHUB_STEP_SUMMARY
          echo "no broken internal links, fact manifests intact, no capability overclaims." >> $GITHUB_STEP_SUMMARY
